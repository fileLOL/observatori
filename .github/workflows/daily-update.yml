name: Actualització diària
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm run update
      - name: Commit
        run: |
          git config user.name 'daily-bot'
          git config user.email 'actions@github.com'
          git add data/content.json
          git diff --cached --quiet || git commit -m 'chore: daily update'
          git push
